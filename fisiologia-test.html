<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test de Fisiología · Quiz de enfermería</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="prueba.css">
  <link rel="stylesheet" href="Bioquimica4-6.css">
  <link rel="stylesheet" href="apuntes.css">
  <link rel="stylesheet" href="fisiologia.css">
</head>
<body>
  <main class="prueba">
    <nav class="migas" aria-label="Ruta">
      <a href="index.html">Inicio</a>
      <span class="migas-separador" aria-hidden="true">›</span>
      <a href="Fisiologia.html">Fisiología</a>
      <span class="migas-separador" aria-hidden="true">›</span>
      <span id="migas-test" aria-current="page">Test</span>
    </nav>

    <header class="test-cabecera">
      <p id="test-bloque" class="test-bloque"></p>
      <h1 id="test-titulo">Fisiología</h1>
    </header>

    <form id="cuestionario" class="cuestionario" novalidate></form>

    <p id="resultado" class="resultado" role="status" aria-live="polite"></p>

    <div class="acciones">
      <button type="button" id="corregir" class="boton">Corregir</button>
      <button type="button" id="reiniciar" class="boton-secundario" hidden>Volver a intentar</button>
      <a id="siguiente" class="boton" href="Fisiologia.html" hidden>Siguiente test</a>
    </div>
  </main>

  <dialog id="ventana" class="ventana" aria-labelledby="ventana-titulo">
    <div class="ventana-contenido">
      <h2 id="ventana-titulo">Explicación</h2>
      <p id="ventana-texto"></p>
      <button type="button" id="cerrar" class="boton-cerrar">Cerrar</button>
    </div>
  </dialog>

  <script src="fisiologia-bloque1.js"></script>
  <script src="fisiologia-bloque2.js"></script>
  <script src="fisiologia-bloque3.js"></script>
  <script src="fisiologia-bloque4.js"></script>
  <script src="fisiologia-bloque5.js"></script>
  <script src="fisiologia-test.js"></script>
</body>
</html>
