<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 365" role="img" font-family="Fredoka, Trebuchet MS, sans-serif">
<title>Las cuatro reacciones de una vuelta de β-oxidación en la matriz mitocondrial: oxidación con FAD, hidratación, oxidación con NAD⁺ y tiólisis, que libera acetil-CoA y un acil-CoA dos carbonos más corto que vuelve a empezar</title>
<defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a1730"/></marker>
<marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c2255c"/></marker></defs>
<rect width="440" height="365" fill="#fff"/>
<rect x="120.0" y="20" width="200" height="30" rx="9" fill="#fde4ec" stroke="#c2255c" stroke-width="2"/><text x="220.0" y="39.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4a1730" >Acil-CoA (n C)</text><rect x="120.0" y="92" width="200" height="30" rx="9" fill="#fff" stroke="#7a6470" stroke-width="2"/><text x="220.0" y="111.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4a1730" >trans-Δ²-Enoil-CoA</text><line x1="220" y1="51" x2="220" y2="89" stroke="#4a1730" stroke-width="2.5" marker-end="url(#f)" /><circle cx="196" cy="70" r="11" fill="#c2255c"/><text x="196" y="75" text-anchor="middle" font-size="14" font-weight="600" fill="#fff" >1</text><text x="240" y="66" text-anchor="start" font-size="12.5" font-weight="600" fill="#c2255c" >Oxidación</text><text x="240" y="81" text-anchor="start" font-size="11.5" font-weight="500" fill="#7a6470" >FAD → FADH₂</text><rect x="120.0" y="164" width="200" height="30" rx="9" fill="#fff" stroke="#7a6470" stroke-width="2"/><text x="220.0" y="183.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4a1730" >3-Hidroxiacil-CoA</text><line x1="220" y1="123" x2="220" y2="161" stroke="#4a1730" stroke-width="2.5" marker-end="url(#f)" /><circle cx="196" cy="142" r="11" fill="#c2255c"/><text x="196" y="147" text-anchor="middle" font-size="14" font-weight="600" fill="#fff" >2</text><text x="240" y="138" text-anchor="start" font-size="12.5" font-weight="600" fill="#c2255c" >Hidratación</text><text x="240" y="153" text-anchor="start" font-size="11.5" font-weight="500" fill="#7a6470" >+ H₂O</text><rect x="120.0" y="236" width="200" height="30" rx="9" fill="#fff" stroke="#7a6470" stroke-width="2"/><text x="220.0" y="255.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4a1730" >3-Cetoacil-CoA</text><line x1="220" y1="195" x2="220" y2="233" stroke="#4a1730" stroke-width="2.5" marker-end="url(#f)" /><circle cx="196" cy="214" r="11" fill="#c2255c"/><text x="196" y="219" text-anchor="middle" font-size="14" font-weight="600" fill="#fff" >3</text><text x="240" y="210" text-anchor="start" font-size="12.5" font-weight="600" fill="#c2255c" >Oxidación</text><text x="240" y="225" text-anchor="start" font-size="11.5" font-weight="500" fill="#7a6470" >NAD⁺ → NADH</text><rect x="75.0" y="308" width="290" height="30" rx="9" fill="#fde4ec" stroke="#c2255c" stroke-width="2"/><text x="220.0" y="327.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4a1730" >Acetil-CoA  +  Acil-CoA (n − 2 C)</text><line x1="220" y1="267" x2="220" y2="305" stroke="#4a1730" stroke-width="2.5" marker-end="url(#f)" /><circle cx="196" cy="286" r="11" fill="#c2255c"/><text x="196" y="291" text-anchor="middle" font-size="14" font-weight="600" fill="#fff" >4</text><text x="240" y="282" text-anchor="start" font-size="12.5" font-weight="600" fill="#c2255c" >Tiólisis</text><text x="240" y="297" text-anchor="start" font-size="11.5" font-weight="500" fill="#7a6470" >+ CoA-SH</text><path d="M366,323 C430,300 430,60 335,35" fill="none" stroke="#c2255c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#fr)"/><text x="432" y="190" text-anchor="end" font-size="11.5" font-weight="500" fill="#c2255c" >vuelve</text><text x="432" y="204" text-anchor="end" font-size="11.5" font-weight="500" fill="#c2255c" >a empezar</text>
</svg>
