<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 270" role="img" font-family="Fredoka, Trebuchet MS, sans-serif">
<title>Ciclo de la urea: en la mitocondria el amoníaco y el CO₂ forman carbamoil-fosfato (carbamoil fosfato sintetasa I), que con la ornitina da citrulina; en el citoplasma la citrulina se une al aspartato (1) para formar argininosuccinato, que libera fumarato y da arginina, y la arginina se rompe en urea y ornitina</title>
<defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a1730"/></marker>
<marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c2255c"/></marker></defs>
<rect width="440" height="270" fill="#fff"/>
<rect x="15" y="15" width="200" height="230" rx="14" fill="#fde4ec" stroke="#c2255c" stroke-width="2" stroke-dasharray="7 5"/><text x="115" y="36" text-anchor="middle" font-size="12.5" font-weight="600" fill="#c2255c" >Mitocondria</text><text x="330" y="36" text-anchor="middle" font-size="12.5" font-weight="600" fill="#c2255c" >Citoplasma</text><rect x="40" y="55" width="150" height="30" rx="9" fill="#fff" stroke="#7a6470" stroke-width="2"/><text x="115.0" y="74.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#4a1730" >NH₃ + CO₂</text><line x1="115" y1="86" x2="115" y2="113" stroke="#4a1730" stroke-width="2" marker-end="url(#f)" /><text x="124" y="104" text-anchor="start" font-size="11" font-weight="500" fill="#7a6470" >CPS I (2 ATP)</text><rect x="40" y="115" width="150" height="30" rx="9" fill="#fff" stroke="#c2255c" stroke-width="2"/><text x="115.0" y="134.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4a1730" >Carbamoil-fosfato</text><line x1="115" y1="146" x2="115" y2="183" stroke="#4a1730" stroke-width="2" marker-end="url(#f)" /><rect x="40" y="185" width="150" height="30" rx="9" fill="#fff" stroke="#c2255c" stroke-width="2"/><text x="115.0" y="204.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4a1730" >Citrulina</text><line x1="191" y1="200" x2="250" y2="200" stroke="#4a1730" stroke-width="2" marker-end="url(#f)" /><rect x="252" y="185" width="170" height="30" rx="9" fill="#fff" stroke="#c2255c" stroke-width="2"/><text x="337.0" y="204.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4a1730" >Argininosuccinato</text><text x="300" y="255" text-anchor="middle" font-size="12" font-weight="600" fill="#4a1730" >Aspartato</text><line x1="300" y1="243" x2="300" y2="218" stroke="#4a1730" stroke-width="2" marker-end="url(#f)" /><circle cx="336" cy="254" r="10" fill="#c2255c"/><text x="336" y="259" text-anchor="middle" font-size="14" font-weight="600" fill="#fff" >1</text><line x1="337" y1="184" x2="337" y2="146" stroke="#4a1730" stroke-width="2" marker-end="url(#f)" /><text x="346" y="170" text-anchor="start" font-size="11" font-weight="500" fill="#7a6470" >fumarato</text><rect x="262" y="115" width="150" height="30" rx="9" fill="#fff" stroke="#c2255c" stroke-width="2"/><text x="337.0" y="134.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4a1730" >Arginina</text><line x1="337" y1="114" x2="337" y2="87" stroke="#4a1730" stroke-width="2" marker-end="url(#f)" /><rect x="262" y="55" width="150" height="30" rx="9" fill="#fde4ec" stroke="#c2255c" stroke-width="2"/><text x="337.0" y="74.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4a1730" >Urea → orina</text><path d="M262,130 C230,130 230,150 190,165" fill="none" stroke="#4a1730" stroke-width="2" marker-end="url(#f)"/><text x="222" y="108" text-anchor="start" font-size="11.5" font-weight="600" fill="#4a1730" >Ornitina</text>
</svg>
