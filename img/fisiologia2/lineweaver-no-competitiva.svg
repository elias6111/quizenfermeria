<rect width="440" height="285" fill="#fff"/>
<line x1="30" y1="200" x2="425" y2="200" stroke="#4a1730" stroke-width="2" marker-end="url(#f)" /><line x1="170" y1="225" x2="170" y2="20" stroke="#4a1730" stroke-width="2" marker-end="url(#f)" /><text x="420" y="222" text-anchor="end" font-size="13" font-weight="500" fill="#4a1730" >1/[S]</text><text x="162" y="28" text-anchor="end" font-size="13" font-weight="500" fill="#4a1730" >1/V</text><line x1="85" y1="216.66666666666666" x2="410" y2="0.0" stroke="#4a1730" stroke-width="3" /><line x1="85" y1="231.25" x2="410" y2="-175.0" stroke="#c2255c" stroke-width="3" /><line x1="300" y1="248" x2="330" y2="248" stroke="#4a1730" stroke-width="3" /><text x="338" y="252" text-anchor="start" font-size="12" font-weight="500" fill="#4a1730" >sin inhibidor</text><line x1="300" y1="268" x2="330" y2="268" stroke="#c2255c" stroke-width="3" /><text x="338" y="272" text-anchor="start" font-size="12" font-weight="500" fill="#4a1730" >con inhibidor</text>
