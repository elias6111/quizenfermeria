<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 205" role="img" font-family="Fredoka, Trebuchet MS, sans-serif">
<title>Esquema de un nucleótido: fosfato (1), pentosa (2) y base púrica (3); el enlace entre la base y el carbono 1' está marcado con un interrogante</title>
<rect width="430" height="205" fill="#fff"/>
<line x1="78" y1="80" x2="122" y2="80" stroke="#4a1730" stroke-width="3"/>
<line x1="122" y1="80" x2="155" y2="102" stroke="#4a1730" stroke-width="3"/>
<circle cx="50" cy="80" r="28" fill="#fde4ec" stroke="#c2255c" stroke-width="3"/><text x="50" y="86" text-anchor="middle" font-size="20" font-weight="600" fill="#c2255c">P</text>
<text x="118" y="70" text-anchor="middle" font-size="13" font-weight="500" fill="#4a1730">5'</text>
<polygon points="200,70 245,102 228,155 172,155 155,102" fill="#fde4ec" stroke="#c2255c" stroke-width="3"/>
<text x="200" y="64" text-anchor="middle" font-size="13" font-weight="500" fill="#4a1730">O</text><text x="258" y="98" text-anchor="middle" font-size="13" font-weight="500" fill="#4a1730">1'</text>
<line x1="245" y1="102" x2="320" y2="124" stroke="#4a1730" stroke-width="3" stroke-dasharray="6 4"/>
<polygon points="375,70 401,85 401,115 375,130 349,115 349,85" fill="#fde4ec" stroke="#c2255c" stroke-width="3"/>
<polygon points="349,85 349,115 320,124 302,100 320,76" fill="#fde4ec" stroke="#c2255c" stroke-width="3"/>
<circle cx="50" cy="30" r="13" fill="#c2255c"/><text x="50" y="35" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">1</text><circle cx="200" cy="185" r="13" fill="#c2255c"/><text x="200" y="190" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">2</text><circle cx="375" cy="160" r="13" fill="#c2255c"/><text x="375" y="165" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">3</text><circle cx="279" cy="92" r="13" fill="#c2255c"/><text x="279" y="97" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">?</text>
</svg>
