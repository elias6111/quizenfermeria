<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 270" role="img" font-family="Fredoka, Trebuchet MS, sans-serif">
<title>Cadena transportadora de electrones en la membrana mitocondrial interna: complejos I, II, III y IV, la coenzima Q entre I-II y III, el citocromo c entre III y IV y el complejo V (ATP sintasa); el NADH entra por el complejo I, el FADH₂ por el II, el oxígeno se reduce a agua en el IV y los protones bombeados vuelven por el V formando ATP</title>
<defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a1730"/></marker>
<marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c2255c"/></marker></defs>
<rect width="460" height="270" fill="#fff"/>
<rect x="20" y="120" width="420" height="70" fill="#fde4ec"/><text x="84" y="92" text-anchor="start" font-size="11" font-weight="500" fill="#7a6470" >Espacio intermembrana</text><text x="168" y="226" text-anchor="start" font-size="11" font-weight="500" fill="#7a6470" >Matriz mitocondrial</text><rect x="45" y="112" width="52" height="86" rx="12" fill="#fff" stroke="#c2255c" stroke-width="2.5"/><text x="71" y="162.0" text-anchor="middle" font-size="16" font-weight="600" fill="#c2255c" >I</text><rect x="115" y="146" width="52" height="52" rx="12" fill="#fff" stroke="#c2255c" stroke-width="2.5"/><text x="141" y="179.0" text-anchor="middle" font-size="16" font-weight="600" fill="#c2255c" >II</text><rect x="205" y="112" width="52" height="86" rx="12" fill="#fff" stroke="#c2255c" stroke-width="2.5"/><text x="231" y="162.0" text-anchor="middle" font-size="16" font-weight="600" fill="#c2255c" >III</text><rect x="300" y="112" width="52" height="86" rx="12" fill="#fff" stroke="#c2255c" stroke-width="2.5"/><text x="326" y="162.0" text-anchor="middle" font-size="16" font-weight="600" fill="#c2255c" >IV</text><rect x="385" y="112" width="52" height="86" rx="12" fill="#fff" stroke="#c2255c" stroke-width="2.5"/><text x="411" y="162.0" text-anchor="middle" font-size="16" font-weight="600" fill="#c2255c" >V</text><circle cx="172" cy="150" r="15" fill="#fff" stroke="#4a1730" stroke-width="2"/><text x="172" y="155" text-anchor="middle" font-size="13" font-weight="600" fill="#4a1730" >Q</text><circle cx="275" cy="112" r="15" fill="#fff" stroke="#4a1730" stroke-width="2"/><text x="275" y="117" text-anchor="middle" font-size="13" font-weight="600" fill="#4a1730" >c</text><text x="71" y="250" text-anchor="middle" font-size="12" font-weight="600" fill="#4a1730" >NADH</text><line x1="71" y1="238" x2="71" y2="202" stroke="#4a1730" stroke-width="2" marker-end="url(#f)" /><text x="141" y="250" text-anchor="middle" font-size="12" font-weight="600" fill="#4a1730" >FADH₂</text><line x1="141" y1="238" x2="141" y2="202" stroke="#4a1730" stroke-width="2" marker-end="url(#f)" /><text x="326" y="250" text-anchor="middle" font-size="12" font-weight="600" fill="#4a1730" >½ O₂ → H₂O</text><line x1="326" y1="238" x2="326" y2="202" stroke="#4a1730" stroke-width="2" marker-end="url(#f)" /><text x="411" y="250" text-anchor="middle" font-size="12" font-weight="600" fill="#4a1730" >ADP + Pi → ATP</text><line x1="411" y1="202" x2="411" y2="236" stroke="#c2255c" stroke-width="2.5" marker-end="url(#fr)" /><line x1="71" y1="110" x2="71" y2="70" stroke="#c2255c" stroke-width="2.5" marker-end="url(#fr)" /><text x="71" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="#c2255c" >H+</text><line x1="231" y1="110" x2="231" y2="70" stroke="#c2255c" stroke-width="2.5" marker-end="url(#fr)" /><text x="231" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="#c2255c" >H+</text><line x1="326" y1="110" x2="326" y2="70" stroke="#c2255c" stroke-width="2.5" marker-end="url(#fr)" /><text x="326" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="#c2255c" >H+</text><line x1="411" y1="70" x2="411" y2="108" stroke="#c2255c" stroke-width="2.5" marker-end="url(#fr)" /><text x="411" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="#c2255c" >H+</text>
</svg>
