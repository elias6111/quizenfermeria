<rect width="480" height="340" fill="#fff"/>
<rect x="20" y="20" width="180" height="32" rx="9" fill="#fff" stroke="#c2255c" stroke-width="2"/><text x="110.0" y="40.32" text-anchor="middle" font-size="12" font-weight="600" fill="#4a1730" >Hemo (eritrocito viejo)</text><rect x="20" y="85" width="180" height="32" rx="9" fill="#fff" stroke="#c2255c" stroke-width="2"/><text x="110.0" y="105.32" text-anchor="middle" font-size="12" font-weight="600" fill="#4a1730" >Biliverdina (verde)</text><rect x="20" y="150" width="180" height="32" rx="9" fill="#fff" stroke="#c2255c" stroke-width="2"/><text x="110.0" y="170.32" text-anchor="middle" font-size="12" font-weight="600" fill="#4a1730" >Bilirrubina no conjugada</text><rect x="240" y="150" width="180" height="32" rx="9" fill="#fff" stroke="#c2255c" stroke-width="2"/><text x="330.0" y="170.32" text-anchor="middle" font-size="12" font-weight="600" fill="#4a1730" >Bilirrubina conjugada</text><rect x="240" y="215" width="180" height="32" rx="9" fill="#fff" stroke="#c2255c" stroke-width="2"/><text x="330.0" y="235.32" text-anchor="middle" font-size="12" font-weight="600" fill="#4a1730" >Urobilinógeno (intestino)</text><line x1="110" y1="53" x2="110" y2="83" stroke="#4a1730" stroke-width="2" marker-end="url(#f)" /><text x="122" y="73" text-anchor="start" font-size="11" font-weight="500" fill="#7a6470" >− Fe²⁺ (se reutiliza)</text><line x1="110" y1="118" x2="110" y2="148" stroke="#4a1730" stroke-width="2" marker-end="url(#f)" /><circle cx="160" cy="197" r="11" fill="#c2255c"/><text x="160" y="202" text-anchor="middle" font-size="14" font-weight="600" fill="#fff" >1</text><text x="110" y="230" text-anchor="middle" font-size="11" font-weight="500" fill="#7a6470" >viaja en sangre unida a</text><text x="110" y="244" text-anchor="middle" font-size="11" font-weight="500" fill="#7a6470" >la albúmina</text><line x1="201" y1="166" x2="238" y2="166" stroke="#4a1730" stroke-width="2" marker-end="url(#f)" /><circle cx="220" cy="140" r="11" fill="#c2255c"/><text x="220" y="145" text-anchor="middle" font-size="14" font-weight="600" fill="#fff" >2</text><text x="330" y="140" text-anchor="middle" font-size="11" font-weight="500" fill="#7a6470" >+ ác. glucurónico (hígado)</text><line x1="330" y1="183" x2="330" y2="213" stroke="#4a1730" stroke-width="2" marker-end="url(#f)" /><text x="338" y="203" text-anchor="start" font-size="11" font-weight="500" fill="#7a6470" >bilis</text><line x1="300" y1="248" x2="250" y2="280" stroke="#4a1730" stroke-width="2" marker-end="url(#f)" /><line x1="360" y1="248" x2="410" y2="280" stroke="#4a1730" stroke-width="2" marker-end="url(#f)" /><rect x="175" y="282" width="150" height="30" rx="9" fill="#fde4ec" stroke="#c2255c" stroke-width="2"/><text x="250.0" y="301.32" text-anchor="middle" font-size="12" font-weight="600" fill="#4a1730" >Estercobilina</text><text x="250" y="328" text-anchor="middle" font-size="11" font-weight="500" fill="#7a6470" >heces</text><rect x="345" y="282" width="120" height="30" rx="9" fill="#fde4ec" stroke="#c2255c" stroke-width="2"/><text x="405.0" y="301.32" text-anchor="middle" font-size="12" font-weight="600" fill="#4a1730" >Urobilina</text><text x="405" y="328" text-anchor="middle" font-size="11" font-weight="500" fill="#7a6470" >orina (riñón)</text><circle cx="250" cy="262" r="11" fill="#c2255c"/><text x="250" y="267" text-anchor="middle" font-size="14" font-weight="600" fill="#fff" >3</text>
