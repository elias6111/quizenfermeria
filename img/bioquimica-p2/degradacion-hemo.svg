<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" role="img" font-family="Fredoka, Trebuchet MS, sans-serif">
<title>Degradación del grupo hemo: el hemo pierde el hierro y pasa a biliverdina y bilirrubina no conjugada (1), que el hígado conjuga con ácido glucurónico (2); por la bilis llega al intestino, donde las bacterias la convierten en urobilinógeno, que da estercobilina en las heces (3) y, la parte reabsorbida, urobilina en la orina</title>
<defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a1730"/></marker>
