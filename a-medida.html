      <h1>Test a medida</h1>
      <p class="subtitulo">Elige la asignatura, los temas y cuántas preguntas quieres</p>

      <form id="medida" class="medida-formulario">
        <fieldset class="medida-paso">
          <legend>1 · Asignatura</legend>
          <div id="asignaturas" class="pastillas"></div>
        </fieldset>

        <fieldset class="medida-paso">
          <legend>2 · Temas</legend>
          <div class="medida-atajos">
            <button type="button" class="enlace-boton" id="todos">Marcar todos</button>

          </div>
          <div id="temas"></div>
        </fieldset>

        <fieldset class="medida-paso">
          <legend>3 · Número de preguntas</legend>
          <div id="cantidades" class="pastillas"></div>
        </fieldset>

        <p id="medida-resumen" class="medida-resumen" aria-live="polite"></p>
        <button type="submit" id="empezar" class="boton">Empezar</button>
      </form>
    </div>
